meta=um-atmos/vn13.1

[command]
default=um-atmos
recon=um-recon

[env]
ATMOS_KEEP_MPP_STDOUT=true
ATMOS_STDOUT_FILE=pe_output/${RUNID}.fort6.pe
COUPLER=none
DR_HOOK=false
!!DR_HOOK_CATCH_SIGNALS=0
