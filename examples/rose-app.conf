ENS_MEMBER=0
HISTORY=$DATAM/${RUNID}.xhist
!!HYBRID_COMPONENT=none
PRINT_STATUS=PrStatus_Normal
RCF_PRINTSTATUS=PrStatus_Normal
RCF_TIMER=false
RECON_KEEP_MPP_STDOUT=true
RECON_STDOUT_FILE=pe_output/${RUNID}.fort6.pe
SPECTRAL_FILE_DIR=spectral_files
STASHMASTER=.
UM_THREAD_LEVEL=MULTIPLE
VN=13.1

[file:$DATAM]
